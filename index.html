<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoupFork Studios — Simmering</title>
<meta name="description" content="SoupFork Studios. Something's on the stove.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --yolk: #f7a81b;
    --yolk-deep: #e0910a;
    --ink: #1c1712;
    --chrome: #cfd3d8;
    --chrome-dark: #6b7078;
    --beard: #7a4a23;
    --bowl-red: #b6301f;
    --cream: #fff3dd;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--yolk);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    overflow-x:hidden;
  }

  body{
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,0.16), transparent 40%),
      radial-gradient(circle at 85% 82%, rgba(0,0,0,0.10), transparent 45%),
      var(--yolk);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:6vh 6vw;
  }

  .wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(2rem, 5vw, 5rem);
    max-width:1180px;
    width:100%;
    flex-wrap:wrap;
  }

  /* ---------- Logo side ---------- */
  .logo-side{
    position:relative;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo-frame{
    width:min(360px, 62vw);
    aspect-ratio:1/1;
    border-radius:50%;
    overflow:hidden;
    border:6px solid var(--ink);
    box-shadow:
      0 0 0 10px var(--yolk),
      0 0 0 12px var(--ink),
      0 30px 60px -20px rgba(0,0,0,0.45);
    background:var(--yolk);
  }

  .logo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:35% 50%;
    transform:scale(1.35);
  }

  /* steam wisps rising off the bowl in the logo */
  .steam{
    position:absolute;
    top:-14%;
    left:8%;
    width:70px;
    height:120px;
    pointer-events:none;
  }
  .steam span{
    position:absolute;
    bottom:0;
    width:10px;
    height:56px;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    filter:blur(3px);
    animation:rise 3.6s ease-in infinite;
    opacity:0;
  }
  .steam span:nth-child(1){ left:6px; animation-delay:0s; }
  .steam span:nth-child(2){ left:24px; height:70px; animation-delay:.9s; }
  .steam span:nth-child(3){ left:42px; animation-delay:1.8s; }
  .steam span:nth-child(4){ left:14px; height:44px; animation-delay:2.7s; }

  @keyframes rise{
    0%{ transform:translateY(0) scaleX(1); opacity:0; }
    15%{ opacity:.75; }
    55%{ opacity:.5; }
    100%{ transform:translateY(-120px) scaleX(1.6); opacity:0; }
  }

  /* ---------- Text side ---------- */
  .text-side{
    flex:1 1 420px;
    max-width:560px;
    text-align:left;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:.6em;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--yolk);
    padding:.5em 1em;
    border-radius:999px;
    transform:rotate(-2deg);
    box-shadow:0 6px 0 rgba(0,0,0,0.18);
  }
  .eyebrow::before{
    content:"";
    width:.5em;
    height:.5em;
    border-radius:50%;
    background:var(--bowl-red);
    animation:blink 1.6s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:.15; } }

  h1{
    font-family:'Bangers', cursive;
    font-weight:400;
    letter-spacing:.02em;
    line-height:.92;
    font-size:clamp(3.2rem, 8vw, 5.6rem);
    margin:.4em 0 0;
    color:var(--ink);
    text-shadow:
      3px 3px 0 var(--chrome),
      6px 6px 0 rgba(28,23,18,0.18);
  }
  h1 .studios{
    display:block;
    color:#fff;
    -webkit-text-stroke:2px var(--ink);
    text-shadow:
      3px 3px 0 var(--beard),
      6px 6px 0 rgba(28,23,18,0.18);
  }

  .tagline{
    margin:1.1em 0 0;
    font-size:1.15rem;
    font-weight:500;
    max-width:32ch;
    color:rgba(28,23,18,0.85);
  }
  .tagline em{
    font-style:italic;
    font-weight:600;
    color:var(--bowl-red);
  }

  /* pot / progress signature */
  .pot{
    margin-top:2.4em;
    display:flex;
    align-items:center;
    gap:1em;
  }
  .pot-label{
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--beard);
    white-space:nowrap;
  }
  .pot-track{
    position:relative;
    flex:1;
    height:14px;
    border-radius:999px;
    background:rgba(28,23,18,0.15);
    border:2px solid var(--ink);
    overflow:hidden;
  }
  .pot-fill{
    position:absolute;
    inset:0;
    width:38%;
    border-radius:999px;
    background:repeating-linear-gradient(
      -45deg,
      var(--bowl-red) 0 10px,
      #d94a34 10px 20px
    );
    animation:simmer 1.4s linear infinite;
  }
  @keyframes simmer{
    from{ background-position:0 0; }
    to{ background-position:28px 0; }
  }

  .note{
    margin-top:1.6em;
    font-size:.92rem;
    color:rgba(28,23,18,0.7);
    line-height:1.5;
  }

  footer{
    position:fixed;
    bottom:1.2rem;
    left:0;
    right:0;
    text-align:center;
    font-size:.75rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:rgba(28,23,18,0.55);
    font-weight:600;
  }

  @media (max-width:640px){
    .wrap{ flex-direction:column; text-align:center; }
    .text-side{ text-align:center; }
    .tagline{ margin-left:auto; margin-right:auto; }
    .pot{ justify-content:center; }
  }

  @media (prefers-reduced-motion: reduce){
    .steam span, .eyebrow::before, .pot-fill{ animation:none; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="logo-side">
      <div class="steam" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="logo-frame">
        <img src="logo.jpg" alt="SoupFork Studios mascot — a chrome fork-headed figure with a beard and sunglasses, arms crossed beside a steaming bowl of soup">
      </div>
    </div>

    <div class="text-side">
      <span class="eyebrow">Kitchen closed</span>
      <h1>SoupFork<span class="studios">Studios</span></h1>
      <p class="tagline">Something's <em>simmering</em>. The site isn't served yet — check back soon.</p>

      <div class="pot" role="status" aria-label="Site under construction">
        <span class="pot-label">Simmering</span>
        <div class="pot-track">
          <div class="pot-fill"></div>
        </div>
      </div>

      <p class="note">Soup Fork Studios LLC</p>
    </div>
  </div>

  <footer>&copy; <span id="year"></span> Soup Fork Studios</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
